<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activer mon compte</title>
  <link rel="stylesheet" href="css/style_login.css">
</head>
<body>

<div class="login-container">

  <div class="login-brand">
    <div class="brand-logo">
      <rect width="56" height="56" rx="10" fill="rgba(255,255,255,0.15)"/>
      <path d="M28 8 C20 18 14 24 18 34 C20 39 24 42 28 44
               C32 42 36 39 38 34 C42 24 36 18 28 8Z"
            fill="white" opacity="0.9"/>
      <path d="M16 46 L28 30 L40 46Z" fill="rgba(45,106,45,0.85)"/>
      </svg>
      <div class="brand-name">
        <div class="name-main">DSFD</div>
        <div class="name-sub">Direction des Systèmes<br>Financiers Décentralisés</div>
      </div>
    </div>

    <div class="brand-tagline">
      <h1>Activation de votre compte</h1>
      <p>Choisissez le mot de passe qui vous permettra de vous connecter à la plateforme.</p>
    </div>
  </div>

  <div class="login-form-panel">

    <div class="form-heading">
      <h2>Définir mon mot de passe</h2>
    </div>

    <form id="activationForm" novalidate>

      <div class="field-group">
        <label class="field-label" for="password">Nouveau mot de passe</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password"
                 placeholder="8 caractères minimum" required minlength="8">
          <button type="button" class="toggle-pw" id="togglePw1" aria-label="Afficher/Masquer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="password2">Confirmer le mot de passe</label>
        <div class="input-wrapper">
          <input type="password" id="password2" name="password2"
                 placeholder="Retapez le mot de passe" required minlength="8">
          <button type="button" class="toggle-pw" id="togglePw2" aria-label="Afficher/Masquer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit">Activer mon compte</button>

    </form>

    <p id="message"></p>

  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.getElementById('togglePw1').addEventListener('click', function () {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('togglePw2').addEventListener('click', function () {
    const pw = document.getElementById('password2');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token');
  const form   = document.getElementById('activationForm');
  const msg    = document.getElementById('message');

  if (!token) {
    msg.style.color = 'red';
    msg.textContent = "❌ Lien invalide : aucun jeton d'activation trouvé dans l'URL.";
    form.querySelector('button[type="submit"]').disabled = true;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw1 = document.getElementById('password').value;
    const pw2 = document.getElementById('password2').value;

    if (pw1.length < 8) {
      msg.style.color = 'red';
      msg.textContent = '⚠️ Le mot de passe doit contenir au moins 8 caractères.';
      return;
    }
    if (pw1 !== pw2) {
      msg.style.color = 'red';
      msg.textContent = '⚠️ Les deux mots de passe ne correspondent pas.';
      return;
    }

    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    msg.style.color = '#475569';
    msg.textContent = 'Activation en cours…';

    try {
      const res = await fetch(`${API_URL}/utilisateurs/definir-mot-de-passe`, {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ token, mot_de_passe: pw1 })
      });
      const data = await res.json();

      if (res.ok) {
        msg.style.color = 'green';
        msg.textContent = '✅ Compte activé ! Redirection…';
        localStorage.setItem('utilisateur', JSON.stringify(data.utilisateur));
        localStorage.setItem('token', data.token);
        const destination = data.utilisateur?.role === 'directeur'
          ? 'Administration.html' : 'dashboard.html';
        setTimeout(() => { window.location.href = destination; }, 1200);
      } else {
        msg.style.color = 'red';
        msg.textContent = '❌ ' + (data.detail || "Erreur lors de l'activation.");
        btn.disabled = false;
      }
    } catch {
      msg.style.color = 'red';
      msg.textContent = '❌ Serveur inaccessible.';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
